name: Unit Tests CI (.NET 10)

on:
  push:
    branches:
      - '**' # Executa em qualquer branch a cada commit/push
  pull_request:
    branches:
      - '**' # Executa em qualquer PR

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout do código-fonte
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Configuração do SDK do .NET 10
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # # 3. Restauração das dependências NuGet no diretório src/app
      # - name: Restore Dependencies
      #   run: dotnet restore
      #   working-directory: ./src/app

      # Adicione este passo para investigar onde estão os arquivos do projeto
      - name: Listar arquivos e pastas
        run: find . -name "*.csproj" -o -name "*.sln"

      # 4. Compilação da aplicação em modo Release
      - name: Build Solution
        run: dotnet build --no-restore -c Release
        working-directory: ./src/app

      # # 5. Execução dos testes unitários
      # - name: Run Unit Tests
      #   run: dotnet test src/app/SuaApp.Tests.csproj --no-build -c Release --logger "trx;LogFileName=test_results.trx"
      #   working-directory: ./src/app